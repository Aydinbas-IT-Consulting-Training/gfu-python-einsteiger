[project]
name = "gfu-python-einsteiger"
version = "0.1.0"
description = "GFU-Schulung s2099: Python für Programmier-Anfänger"
readme = "README.md"
requires-python = ">=3.15"
dependencies = [
    "colabturtle>=2.1",  # Turtle-Grafik direkt im Notebook
    "ipykernel>=6.29",
    "pytest>=8.3",
    "tzdata>=2025.2",  # Zeitzonen für zoneinfo unter Windows
    # Ausblick-Notebooks 15-18: Excel, Landkarten, maschinelles Lernen, Bilder
    "folium>=0.20",  # interaktive Karten für GeoDataFrame.explore()
    "geopandas>=1.2",
    "mapclassify>=2.8",  # Klasseneinteilung für Karten
    "matplotlib>=3.11",
    "openpyxl>=3.1",
    "pandas>=3.1",
    "pillow>=13.0",
    "scikit-learn>=1.9",
]

[dependency-groups]
dev = [
    "nbclient>=0.10",
    "nbformat>=5.10",
    "ruff>=0.9",
]

[tool.uv]
compile-bytecode = true  # sonst zeigt ColabTurtle beim ersten Import eine SyntaxWarning im Notebook

[tool.pytest.ini_options]
pythonpath = ["projekte"]  # Notebook 14 testet projekte/tictactoe.py
testpaths = ["testen"]

[tool.ruff]
line-length = 88
extend-exclude = ["*.ipynb"]  # Notebooks enthalten absichtliche Fehlerbeispiele
src = [".", "projekte", "testen"]

[tool.ruff.lint.per-file-ignores]
"testen/*" = ["PLR0133"]  # Vergleiche von Konstanten zeigen, wie assert arbeitet
